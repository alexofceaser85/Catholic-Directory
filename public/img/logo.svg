<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Crucifix between a hammer and a sickle">
  <!-- Logo and browser-tab icon: a crucifix (faith) between a hammer (the trades) and a
       sickle (the harvest), in the green and gold of Ordinary Time vestments.
       The crucifix is a gilded corpus on a wooden cross. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3517"/>
      <stop offset="0.35" stop-color="#8b5a2b"/>
      <stop offset="0.65" stop-color="#7a4c22"/>
      <stop offset="1" stop-color="#4a2b12"/>
    </linearGradient>
    <linearGradient id="wood-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5a2b"/>
      <stop offset="0.6" stop-color="#734722"/>
      <stop offset="1" stop-color="#4a2b12"/>
    </linearGradient>
    <!-- Gilded bronze, lit from the upper left -->
    <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#fbe7a6"/>
      <stop offset="0.45" stop-color="#e2b453"/>
      <stop offset="1" stop-color="#a06e1e"/>
    </linearGradient>
    <linearGradient id="linen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#d9ccb0"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="31" fill="#1f6b3a"/>
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#e3b955" stroke-width="1.2"/>

  <!-- Hammer, leaning left -->
  <g transform="rotate(-25 18 42)" fill="#e3b955">
    <rect x="16.6" y="33.5" width="2.8" height="17.5" rx="1.2"/>
    <path d="M11.5 30 h11 a1.4 1.4 0 0 1 1.4 1.4 v2.4 a1.4 1.4 0 0 1 -1.4 1.4 h-11 l-1.6 -2.6 z"/>
  </g>

  <!-- Sickle, leaning right: a crescent blade on a short handle -->
  <g fill="#e3b955">
    <path d="M43 41 C 56.5 41, 59 22.5, 45.5 17 C 53.5 23.5, 52 37, 43 37.6 Z"/>
    <path d="M43 39.3 L 47.4 51" stroke="#e3b955" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- Wooden cross with grain -->
  <rect x="29.8" y="5.4" width="4.4" height="49.6" fill="url(#wood)" stroke="#3a210c" stroke-width="0.3"/>
  <rect x="19.2" y="15.9" width="25.6" height="4.3" fill="url(#wood-beam)" stroke="#3a210c" stroke-width="0.3"/>
  <g fill="none" stroke="#3f240d" stroke-width="0.22" opacity="0.55">
    <path d="M31 6 C 30.8 18, 31.3 32, 31 54.6"/>
    <path d="M33.1 6 C 33.3 20, 32.8 36, 33.2 54.6"/>
    <path d="M19.6 17.2 C 26 17, 38 17.5, 44.4 17.1"/>
    <path d="M19.6 19.1 C 27 19.3, 37 18.9, 44.4 19.2"/>
  </g>

  <!-- INRI title -->
  <rect x="28.3" y="6.5" width="7.4" height="3.4" rx="0.3" fill="#f4e8c8" stroke="#5a3517" stroke-width="0.3"/>
  <text x="32" y="9.05" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="2.45" font-weight="700" letter-spacing="0.12" fill="#5a3517">INRI</text>

  <!-- Halo behind the bowed head -->
  <circle cx="31.1" cy="19.7" r="3.1" fill="#f3d98a" fill-opacity="0.85" stroke="#c4952f" stroke-width="0.35"/>

  <g fill="url(#gilt)" stroke="#6e4a12" stroke-width="0.18" stroke-linejoin="round">
    <!-- Arms: from sagging shoulders up to the nailed hands, with elbows -->
    <path id="arm" d="M20.6 17.6 C 21.2 17.1, 22 17.3, 22.6 17.8 L 25.8 19.5 C 27.4 20.2, 28.9 20.9, 30.4 21.9 L 30.8 24 C 29.2 23.2, 27.4 21.9, 25.7 21 L 22.2 19 C 21.4 18.9, 20.7 18.4, 20.6 17.6 Z"/>
    <use href="#arm" transform="translate(64 0) scale(-1 1)"/>

    <!-- Torso: broad chest narrowing to the waist -->
    <path d="M29.9 21.9 Q 32 21.1 34.1 21.9 C 34.7 23.4, 34.6 25.4, 34.1 27.2 C 33.8 28.8, 33.7 30.2, 33.8 31.4 L 30.2 31.4 C 30.3 30.2, 30.2 28.8, 29.9 27.2 C 29.4 25.4, 29.3 23.4, 29.9 21.9 Z"/>

    <!-- Legs: knees bent and turned, right foot crossed over the left -->
    <path d="M30 34.6 C 30.1 36.8, 30.5 38.8, 30.8 40.6 C 31 42.6, 31.4 44.6, 31.7 46.8 L 32.6 46.8 C 32.5 44.6, 32.4 42.6, 32.3 40.6 C 32.3 38.6, 32.4 36.6, 32.3 34.6 Z"/>
    <path d="M32.2 34.6 C 32.4 36.6, 32.8 38.6, 33 40.4 C 33 42.6, 32.6 44.8, 32.2 47.2 L 33.1 47.4 C 33.6 45, 34 42.6, 34.2 40.4 C 34.4 38.4, 34.5 36.6, 34.4 34.6 Z"/>
    <path d="M31.6 46.6 L 32.6 46.6 L 32.4 48.8 L 31.5 48.6 Z"/>
    <path d="M32.2 47 L 33.2 47.2 L 32.5 49.3 L 31.8 49.1 Z"/>

    <!-- Neck -->
    <path d="M30.9 20.9 C 31.3 21.8, 32.4 22.3, 33.1 21.7 L 32.5 20.4 L 31.3 20.3 Z" stroke="none"/>
  </g>

  <!-- Head, bowed toward His right shoulder. Drawn around (0, 0), then placed and tilted. -->
  <g transform="translate(31.15 19.5) rotate(-24)" stroke-linecap="round" stroke-linejoin="round">
    <!-- long hair behind the face, falling to the shoulders -->
    <path d="M-1.45 -0.4 C -2 0.8, -2 2.3, -1.35 3.4 C -1 3.1, -0.95 2, -1 1 Z" fill="#5a3a0e"/>
    <path d="M1.4 -0.4 C 1.85 0.6, 1.85 1.7, 1.5 2.5 C 1.3 2.1, 1.25 1.1, 1.3 0.4 Z" fill="#5a3a0e"/>
    <!-- face and skull -->
    <path d="M0 -1.95 C 1.1 -1.95, 1.5 -0.9, 1.4 0.2 C 1.3 1.1, 0.8 1.8, 0 1.95 C -0.8 1.8, -1.3 1.1, -1.4 0.2 C -1.5 -0.9, -1.1 -1.95, 0 -1.95 Z"
          fill="url(#gilt)" stroke="#6e4a12" stroke-width="0.12"/>
    <!-- hair over the top of the head, parted in the middle -->
    <path d="M-1.55 -0.1 C -1.75 -1.6, -0.95 -2.25, 0 -2.2 C 0.95 -2.25, 1.75 -1.6, 1.55 -0.1 C 1.35 -0.9, 0.85 -1.35, 0.1 -1.3 L 0 -1.55 L -0.1 -1.3 C -0.85 -1.35, -1.35 -0.9, -1.55 -0.1 Z"
          fill="#6b4512"/>
    <!-- beard along the jaw -->
    <path d="M-1.15 0.75 C -0.95 1.85, -0.45 2.45, 0 2.6 C 0.45 2.45, 0.95 1.85, 1.15 0.75 C 0.75 1.25, 0.4 1.35, 0 1.3 C -0.4 1.35, -0.75 1.25, -1.15 0.75 Z"
          fill="#6b4512"/>
    <!-- closed eyes, brow, nose, mouth -->
    <g fill="none" stroke="#5a3a0e" stroke-width="0.13">
      <path d="M-0.85 -0.25 Q -0.5 -0.02 -0.2 -0.2"/>
      <path d="M0.2 -0.2 Q 0.5 -0.02 0.85 -0.25"/>
      <path d="M-0.9 -0.55 Q -0.5 -0.75 -0.15 -0.55 M0.15 -0.55 Q 0.5 -0.75 0.9 -0.55" stroke-width="0.1" opacity="0.7"/>
      <path d="M0 -0.15 L -0.12 0.62 Q 0 0.72 0.16 0.66"/>
      <path d="M-0.3 1.05 Q 0 1.15 0.3 1.05" stroke-width="0.1"/>
    </g>
    <!-- crown of thorns: two woven strands with thorns -->
    <g fill="none" stroke="#3f2706">
      <path d="M-1.75 -1.2 C -1 -1.75, 1 -1.75, 1.75 -1.2" stroke-width="0.28"/>
      <path d="M-1.7 -1.45 C -0.9 -1.0, 0.9 -1.0, 1.7 -1.45" stroke-width="0.2"/>
      <path d="M-1.3 -1.55 l -0.25 -0.35 M-0.55 -1.65 l -0.05 -0.4 M0.3 -1.65 l 0.1 -0.4 M1.05 -1.55 l 0.3 -0.3 M-0.9 -1.1 l -0.15 0.3 M0.7 -1.1 l 0.15 0.3" stroke-width="0.12"/>
    </g>
  </g>

  <!-- Muscle and rib shading -->
  <g fill="none" stroke="#7a5214" stroke-width="0.22" stroke-linecap="round" opacity="0.8">
    <path d="M30.4 23.6 Q 31.2 24.3 32 23.9 Q 32.8 24.3 33.6 23.6"/>
    <path d="M30.5 25.2 Q 31 25.6 31.5 25.4 M32.5 25.4 Q 33 25.6 33.5 25.2"/>
    <path d="M30.6 26.4 Q 31 26.8 31.5 26.6 M32.5 26.6 Q 33 26.8 33.4 26.4"/>
    <path d="M32 24.6 V 30.4"/>
    <path d="M23.8 18.6 Q 24.6 19.6 25.6 20.1 M40.2 18.6 Q 39.4 19.6 38.4 20.1"/>
    <path d="M31.2 40.4 Q 31.6 40.9 32.1 40.6 M33.1 40.3 Q 33.6 40.8 34 40.4"/>
  </g>
  <!-- Shadow down the body's right side -->
  <path d="M33.6 22.4 C 34.3 24, 34.2 26.4, 33.6 28.6 C 33.4 29.6, 33.4 30.6, 33.5 31.4 L 33.8 31.4 C 33.7 30.2, 33.8 28.8, 34.1 27.2 C 34.6 25.4, 34.7 23.4, 34.1 21.9 Z" fill="#6e4a12" opacity="0.45"/>

  <!-- Loincloth, knotted at the hip, with folds -->
  <path d="M30.1 30.8 L 33.9 30.8 C 34.6 32.2, 34.9 33.6, 34.6 35.2 L 33.2 34.4 L 32.4 36.2 L 31.4 34.6 C 30.6 35, 30 35.3, 29.5 35.6 C 29.6 33.8, 29.8 32.2, 30.1 30.8 Z" fill="url(#linen)" stroke="#8a7a58" stroke-width="0.2" stroke-linejoin="round"/>
  <path d="M34 31.2 C 35.2 32.2, 35.6 34, 35.3 35.8 L 34.5 35 Z" fill="url(#linen)" stroke="#8a7a58" stroke-width="0.2"/>
  <g fill="none" stroke="#a89670" stroke-width="0.2" stroke-linecap="round">
    <path d="M30.6 31.6 Q 31.8 33 31.6 34.4"/>
    <path d="M31.8 31.4 Q 32.8 32.8 32.6 35.4"/>
    <path d="M33 31.4 Q 33.8 32.6 33.6 34.2"/>
  </g>

  <!-- Nails and footrest -->
  <g fill="#2b1a06">
    <circle cx="21.3" cy="17.95" r="0.33"/>
    <circle cx="42.7" cy="17.95" r="0.33"/>
    <circle cx="32.3" cy="47.9" r="0.33"/>
  </g>
  <rect x="30.2" y="49.4" width="4.6" height="1.3" rx="0.2" fill="#4a2b12" stroke="#2b1a06" stroke-width="0.2"/>
</svg>
